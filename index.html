    <a href="index.html"><img id="back"  src="img/backward.png" alt="backward" title="backward"></a>
       
                <h1>Les prochains concerts...</h1> 
                <br></br>       
    
 
<h2>Cliquer sur une affiche ci-dessous </h2>
 <div class="event">
                

         

        <div class="image-gallery">
           
                    
           <img src="img/concert5.jpg" alt="Notre Dame du bon secours" data-tooltip="Notre Dame du bon secours"
                onclick="event.preventDefault(); import('./js/map.js').then(module => module.showMarker(0));"
                style="cursor: pointer; width: 200px;">

          <img src="img/concert6.jpg" alt="Brasserie Les Eiders" data-tooltip="Brasserie Les Eiders"
                onclick="event.preventDefault(); import('./js/map.js').then(module => module.showMarker(1));"
                style="cursor: pointer; width: 200px;">

          <img src="img/concert7.jpg" alt="Les Nouveaux Sauvages" data-tooltip="Les Nouveaux Sauvages"
                onclick="event.preventDefault(); import('./js/map.js').then(module => module.showMarker(2));"
                style="cursor: pointer; width: 200px;">

          <img src="img/concert8.jpg" alt="Le Nouvô Cosmos" data-tooltip="Le Nouvô Cosmos"
                onclick="event.preventDefault(); import('./js/map.js').then(module => module.showMarker(3));"
                style="cursor: pointer; width: 200px;">


          <img src="img/concert9.jpg" alt="Le Nouvô Cosmos" data-tooltip="Le Nouvô Cosmos"
                onclick="event.preventDefault(); import('./js/map.js').then(module => module.showMarker(4));"
                style="cursor: pointer; width: 200px;">
          
          
          
        </div> 
       
    <!--The div element for the map -->
      <div id="map"></div>
    
    </div>
